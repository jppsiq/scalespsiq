<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 877" width="620" height="877"><text x="310" y="40" font-family="Helvetica,Arial,sans-serif" fill="#111" font-size="26" font-weight="700" text-anchor="middle">Teste do Desenho do Relógio</text><text x="310" y="62" font-family="Helvetica,Arial,sans-serif" fill="#111" font-size="14" font-weight="400" text-anchor="middle">Folha de aplicação</text><path d="M68.0 100 H380" stroke="#111" stroke-width="1.6"/><text x="30" y="96" font-family="Helvetica,Arial,sans-serif" fill="#111" font-size="13" font-weight="400" text-anchor="start">Nome</text><path d="M438.0 100 H590" stroke="#111" stroke-width="1.6"/><text x="400" y="96" font-family="Helvetica,Arial,sans-serif" fill="#111" font-size="13" font-weight="400" text-anchor="start">Data</text><path d="M135.5 132 H300" stroke="#111" stroke-width="1.6"/><text x="30" y="128" font-family="Helvetica,Arial,sans-serif" fill="#111" font-size="13" font-weight="400" text-anchor="start">Identificador</text><path d="M395.5 132 H590" stroke="#111" stroke-width="1.6"/><text x="320" y="128" font-family="Helvetica,Arial,sans-serif" fill="#111" font-size="13" font-weight="400" text-anchor="start">Aplicador</text><path d="M30 156 H590" stroke="#111" stroke-width="1.6"/><text x="30" y="180" font-family="Helvetica,Arial,sans-serif" fill="#111" font-size="14" font-weight="400" text-anchor="start">Instrução ao paciente: "Este círculo é um relógio. Coloque os números do relógio e depois</text><text x="30" y="200" font-family="Helvetica,Arial,sans-serif" fill="#111" font-size="14" font-weight="400" text-anchor="start">desenhe os ponteiros marcando onze horas e dez minutos."</text><circle cx="310" cy="420" r="170" fill="none" stroke="#111" stroke-width="2.6"/><text x="310" y="640" font-family="Helvetica,Arial,sans-serif" fill="#111" font-size="15" font-weight="700" text-anchor="middle">Pontuação de Shulman</text><circle cx="46" cy="661" r="6.5" fill="none" stroke="#111" stroke-width="1.6"/><text x="66" y="666" font-family="Helvetica,Arial,sans-serif" fill="#111" font-size="14" font-weight="700" text-anchor="start">5</text><text x="82" y="666" font-family="Helvetica,Arial,sans-serif" fill="#111" font-size="13" font-weight="400" text-anchor="start">Relógio perfeito.</text><circle cx="46" cy="685" r="6.5" fill="none" stroke="#111" stroke-width="1.6"/><text x="66" y="690" font-family="Helvetica,Arial,sans-serif" fill="#111" font-size="14" font-weight="700" text-anchor="start">4</text><text x="82" y="690" font-family="Helvetica,Arial,sans-serif" fill="#111" font-size="13" font-weight="400" text-anchor="start">Erros visuoespaciais leves.</text><circle cx="46" cy="709" r="6.5" fill="none" stroke="#111" stroke-width="1.6"/><text x="66" y="714" font-family="Helvetica,Arial,sans-serif" fill="#111" font-size="14" font-weight="700" text-anchor="start">3</text><text x="82" y="714" font-family="Helvetica,Arial,sans-serif" fill="#111" font-size="13" font-weight="400" text-anchor="start">Ponteiros incorretos, com organização espacial preservada.</text><circle cx="46" cy="733" r="6.5" fill="none" stroke="#111" stroke-width="1.6"/><text x="66" y="738" font-family="Helvetica,Arial,sans-serif" fill="#111" font-size="14" font-weight="700" text-anchor="start">2</text><text x="82" y="738" font-family="Helvetica,Arial,sans-serif" fill="#111" font-size="13" font-weight="400" text-anchor="start">Desorganização visuoespacial moderada, que impede marcar a hora corretamente.</text><circle cx="46" cy="757" r="6.5" fill="none" stroke="#111" stroke-width="1.6"/><text x="66" y="762" font-family="Helvetica,Arial,sans-serif" fill="#111" font-size="14" font-weight="700" text-anchor="start">1</text><text x="82" y="762" font-family="Helvetica,Arial,sans-serif" fill="#111" font-size="13" font-weight="400" text-anchor="start">Desorganização visuoespacial grave.</text><circle cx="46" cy="781" r="6.5" fill="none" stroke="#111" stroke-width="1.6"/><text x="66" y="786" font-family="Helvetica,Arial,sans-serif" fill="#111" font-size="14" font-weight="700" text-anchor="start">0</text><text x="82" y="786" font-family="Helvetica,Arial,sans-serif" fill="#111" font-size="13" font-weight="400" text-anchor="start">Nenhuma tentativa razoável de desenhar um relógio.</text><path d="M30 826 H300 M330 826 H590" stroke="#111" stroke-width="1.6"/><text x="30" y="844" font-family="Helvetica,Arial,sans-serif" fill="#111" font-size="12" font-weight="400" text-anchor="start">Pontuação (0 a 5)</text><text x="330" y="844" font-family="Helvetica,Arial,sans-serif" fill="#111" font-size="12" font-weight="400" text-anchor="start">Assinatura e carimbo</text></svg>